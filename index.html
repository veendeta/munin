<!DOCTYPE html>
<html lang="id" class="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="MUNIN, Order & diskusi via WhatsApp.">
<title>MUNIN's Lair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--white:#ffffff;--black:#000000;--navy:#001159;--neon:#0030ff;--grey:#878fad;
--serif:'Gentium Book Plus',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#000}body{min-height:100%;overflow-x:hidden;color:var(--white);font-family:var(--sans);font-weight:600;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.bgfx{position:fixed;inset:0;z-index:-1;opacity:var(--bgo,1);background:radial-gradient(120% 85% at 50% 38%,var(--navy) 0%,#000a33 42%,#000 80%)}
#track{height:420vh;height:420svh}
canvas.pix{image-rendering:pixelated}
.scr{margin-top:.9rem;font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--grey);animation:blink 2.2s ease-in-out infinite}
.cue{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;text-align:center;opacity:0;pointer-events:none;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:#cfd4e6}
.cue b{font-family:var(--serif);font-size:1.5rem;letter-spacing:.1em;margin-top:.5rem;text-shadow:0 0 18px rgba(0,48,255,.9);display:none}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(135,143,173,.35);background:rgba(0,17,89,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;width:min(290px,86vw);padding:16px;border:1px solid rgba(135,143,173,.35);border-radius:16px;background:rgba(0,6,30,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;pointer-events:auto;touch-action:manipulation}
.panel.open{display:block}
.panel h2{font-size:.6rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--grey);margin-bottom:12px}
.panel label{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.7rem;margin-bottom:12px}
.panel output{color:var(--grey)}
.panel input{grid-column:1/-1;width:100%;accent-color:#0030ff}
.panel button{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(135,143,173,.4);background:transparent;color:#fff;font:600 .65rem var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.hl{font-weight:600;letter-spacing:.14em;padding:0 .1em;background:linear-gradient(transparent 72%,rgba(0,48,255,.6) 72%)}
.cue em{display:block;font-style:normal;font-family:var(--serif);font-size:1.15rem;letter-spacing:.06em;margin-top:.55rem;text-transform:none;color:#fff;text-shadow:0 0 14px rgba(0,48,255,.8)}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;background:none;border:0;padding:6px 10px 6px 2px;text-align:left;cursor:pointer;pointer-events:auto;color:#fff}
.brand b{font-family:var(--serif);font-weight:700;font-size:.95rem;letter-spacing:.32em;text-shadow:0 0 12px rgba(0,48,255,.7);transition:text-shadow .3s}
.brand small{display:block;margin-top:3px;font:600 .5rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--grey);opacity:1}
body.light .brand b{color:#001159;text-shadow:none}
body.light .brand small{color:#34406e}
.brand:hover b{text-shadow:0 0 18px rgba(0,48,255,1)}
.rbtn{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);pointer-events:auto;display:none;padding:12px 22px;border:1px solid rgba(135,143,173,.5);border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font:600 .68rem var(--sans);letter-spacing:.28em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.rbtn.show{display:block}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;pointer-events:auto;display:none;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid rgba(135,143,173,.45);background:rgba(0,17,89,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:600 .66rem var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
body.home .back{display:flex}
body.home .gear,body.home .panel,body.home .rbtn{display:none!important}
body.home .cta{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 0 0 3px rgba(0,48,255,.35),0 12px 56px rgba(0,48,255,.85);animation:fpulse 2.2s ease-in-out infinite}
body.home .btn,body.home .chip{border-color:var(--neon);box-shadow:0 0 22px rgba(0,48,255,.5);color:#fff}
body.home .soon{opacity:1}
@keyframes fpulse{50%{transform:scale(1.025)}}
.invx{position:fixed;inset:0;z-index:60;pointer-events:none;display:none;background:#fff;mix-blend-mode:difference;opacity:0}
html.home{background:#fff}
html.home,html.home body{overflow:hidden}
html.home #c,html.home #track,html.home .invx{display:none!important}
body.home .pill,body.home .hero,body.home .mark,body.home .cue{display:none}
body.p3d .homec{display:none}
body.p3d .cap,body.p3d .foot{visibility:hidden}
body.home .brand b{color:#001159;text-shadow:none}
body.home .brand small,body.home .cap,body.home .foot{color:#4a557f}
.homec{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 215px);pointer-events:none;animation:hin 1s .1s both}
@keyframes hin{from{opacity:0;transform:translateY(14px)}}
.hlogo{height:min(38vh,calc(60vw / .837));aspect-ratio:.837;background:#001159;-webkit-mask:var(--kl) center/contain no-repeat;mask:var(--kl) center/contain no-repeat}
.htag{margin-top:22px;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:#4a557f;opacity:.9;text-align:center}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0}
.fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.d3{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:16px;pointer-events:auto;display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 15px 0 11px;border:0;border-radius:99px;color:#fff;font:600 .58rem var(--sans);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;background:#001159;overflow:hidden;isolation:isolate}
.d3::before{content:'';position:absolute;inset:-70%;z-index:-2;background:conic-gradient(from 0deg,#0030ff,#8aa2ff,#fff,#0030ff 38%,#001159 62%,#0030ff);animation:d3spin 2.6s linear infinite}
.d3::after{content:'';position:absolute;inset:1.5px;z-index:-1;border-radius:inherit;background:#001159}
.d3[data-p=home]{animation:d3glow 2.2s ease-in-out infinite}
.d3[data-p=p3d]::before{animation:none;background:rgba(135,143,173,.55)}
.d3[data-p=home] .arr,.d3[data-p=p3d] .cw{display:none}
@keyframes d3spin{to{transform:rotate(1turn)}}
@keyframes d3glow{0%,100%{box-shadow:0 0 0 0 rgba(0,48,255,.55)}50%{box-shadow:0 0 18px 3px rgba(0,48,255,.45)}}
.cw{display:inline-block;width:14px;height:14px;perspective:70px}
.cube{display:block;width:14px;height:14px;position:relative;transform-style:preserve-3d;animation:cubespin 4.5s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid #9fb4ff;background:rgba(0,48,255,.28)}
.cube i:nth-child(1){transform:translateZ(7px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(7px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(7px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(7px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(7px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(7px)}
@keyframes cubespin{to{transform:rotateX(360deg) rotateY(360deg)}}
.actions{margin-top:auto}
.ghost,.ghost *{color:transparent!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important;background:none!important;border-color:transparent!important;filter:none!important;box-shadow:none!important;animation:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.ghost::before,.ghost::after,.ghost *::before,.ghost *::after{display:none!important}
.grid,.cap,.foot{max-height:200px;transition:opacity .4s,max-height .5s,margin .5s}
body.mid .grid,body.mid .cap,body.mid .foot{opacity:0;max-height:0;margin:0;overflow:hidden;pointer-events:none}
body.mid .actions{gap:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 18px)}
.pill{display:inline-flex;align-items:center;gap:.65rem;padding:.55rem 1rem;border:1px solid rgba(135,143,173,.35);border-radius:99px;
font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:#cfd4e6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:up .9s .2s both}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--neon);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,48,255,.9)}70%,100%{box-shadow:0 0 0 9px rgba(0,48,255,0)}}
.hero{position:absolute;left:50%;top:var(--ty,58%);transform:translate(-50%,0);width:100%;text-align:center;padding:0 20px;will-change:transform}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,17vw,7.5rem);letter-spacing:.14em;padding-left:.14em;line-height:1;color:var(--white);
text-shadow:0 0 28px rgba(0,48,255,.9),0 0 80px rgba(0,48,255,.5);animation:glow 4s ease-in-out infinite alternate;perspective:600px}
@keyframes glow{to{text-shadow:0 0 16px rgba(0,48,255,.6),0 0 56px rgba(0,48,255,.3)}}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em) rotateX(-70deg);filter:blur(10px);
animation:in 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 250ms)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.tag{display:inline-block;position:relative;margin:0 auto;font-size:clamp(.62rem,3.1vw,.82rem);letter-spacing:.26em;text-transform:uppercase;line-height:1.3;white-space:nowrap;color:#c9cee6;animation:up .9s .9s both}
.tag::before,.tag::after{content:'';position:absolute;top:50%;width:clamp(14px,6vw,56px);height:1px;background:linear-gradient(90deg,transparent,var(--neon))}
.tag::before{right:calc(100% + 10px)}
.tag::after{left:calc(100% + 10px);transform:scaleX(-1)}
@keyframes shine{to{background-position:-250% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{position:absolute;left:50%;top:var(--cy,31%);margin:0;font-size:var(--fs,2.2rem);padding-left:.14em;white-space:nowrap;pointer-events:none;will-change:transform;animation:none;
transform:translate(-50%,-50%);text-shadow:var(--gj,0px) 0 0 rgba(0,48,255,.95),calc(var(--gj,0px) * -1) 0 0 rgba(135,143,173,.9),0 0 2px #000,0 0 10px rgba(0,8,40,.95),0 0 24px rgba(0,17,89,.9),0 0 40px rgba(0,48,255,.45)}
.hint{margin-top:1.4rem;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);animation:blink 2.6s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0;animation:none}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.actions{width:min(100%,420px);display:grid;gap:10px;animation:up .9s 1s both}
.actions a,.actions .soon{pointer-events:auto}
.cta,.btn,.chip{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white);border-radius:16px}
.cta{position:relative;overflow:hidden;justify-content:center;padding:16px 18px;background:linear-gradient(135deg,var(--neon),#0a1fc9);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 40px rgba(0,48,255,.5);transition:transform .2s}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:active,.btn:active{transform:scale(.98)}
b{display:block;font-weight:600}
.cta b{font-size:.85rem;letter-spacing:.03em}
small{display:block;font-size:.6rem;letter-spacing:.04em;margin-top:2px;opacity:.75;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
.btn,.chip{padding:13px 14px;background:rgba(0,10,50,.78);border:1px solid rgba(135,143,173,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s}
.btn b{font-size:.74rem}
.btn small,.chip small{color:var(--grey);opacity:1}
.chip{padding:10px 12px;border-radius:14px}
.chip b{font-size:.66rem}
.chip svg{width:18px;height:18px}
a.btn:hover,a.chip:hover{border-color:var(--neon);box-shadow:0 0 24px rgba(0,48,255,.45);transform:translateY(-2px)}
.soon{border-style:dashed;opacity:.7;cursor:default}
.cap,.foot{text-align:center;font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);margin-top:4px}
.foot{letter-spacing:.2em;opacity:.6}
a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
@media (max-height:700px){.actions{gap:8px}.cta{padding:12px 16px}body.p3d .foot,body.p3d .cap{display:none}}
@media (min-width:900px){.actions{width:460px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body class="home">
<div id="track"></div>
<canvas id="c" aria-hidden="true"></canvas>
<div class="invx" id="invx"></div>
<div class="veil" id="veil"></div><canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="ui">
  <h1 id="title" class="mark ghost"></h1>
  <div class="pill ghost"><i></i><span id="status"></span></div>
  <div class="hero ghost" id="hero">
    
    <p class="tag" id="tag"></p>
    <p class="hint" id="hint"></p>
    <p class="scr">Scroll &darr;</p>
  </div>
  <button class="brand" id="brand" aria-label="Buka tampilan brand MUNIN"><b id="bn"></b><small id="bs"></small></button>
  <button class="d3" id="d3" data-p="home" aria-label="Buka halaman 3D interactive"><span class="cw"><span class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></span></span><svg class="arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="d3t">3D Interactive</span></button>
  <div class="homec" id="homec"><div class="hlogo" id="hlogo" role="img" aria-label="MUNIN"></div><p class="htag"></p></div>
  <div class="cue ghost" id="cue"><span id="cueT"></span><em id="cueS"></em></div>
  <button class="rbtn" id="bhr">Semua tertelan · Reset</button>
  <button class="gear" id="gear" aria-label="Pengaturan efek visual"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <div class="panel" id="panel"><h2>Efek</h2>
    <label><span>Pixel memory</span><output>0%</output><input type="range" min="0" max="75" value="0" data-k="pm"></label>
    <label><span>Matrix glitch</span><output>0%</output><input type="range" min="0" max="75" value="0" data-k="mx"></label>
    <label><span>Theme shift</span><output>0%</output><input type="range" min="0" max="75" value="0" data-k="th"></label>
    <label><span>Inverted colors</span><output>0%</output><input type="range" min="0" max="75" value="0" data-k="inv"></label>
    <label><span>Blackhole</span><output>0%</output><input type="range" min="0" max="75" value="0" data-k="bh"></label>
    <button id="rst">Reset semua</button></div>
  <div class="actions" id="actions"></div>
</div>

<script>
/* =====================================================================
   KONFIGURASI — edit bagian ini saja untuk mengubah teks & tombol
   ---------------------------------------------------------------------
   TAMBAH tombol : salin satu baris di `links`, ubah isinya.
   HAPUS tombol  : hapus barisnya, atau tambahkan  enabled:false
   group         : 'social' (tombol besar) | 'market' (chip kecil marketplace)
   url kosong '' : tombol tampil abu-abu "Segera hadir" (belum bisa diklik).
                   Isi url nanti -> otomatis jadi link aktif.
   icon          : instagram | tiktok | whatsapp | bag | link
   ===================================================================== */
const CONFIG = {
  brand:   'MUNIN',
  status:  '3D Interactive',
  tagline: 'Self Reward Untuk Kamu',
  hint:    'Bikin Keren & Nyaman',

  whatsapp: {
    number:  '6285280004806',                       // GANTI: format 62xxx tanpa + / 0 / spasi
    message: 'Halo MUNIN, saya mau order / diskusi.', // teks awal chat
    label:   'Order & Diskusi via WhatsApp',
    sub:     'Chat langsung dengan kami'
  },

  links: [
    { group:'social', label:'Instagram',   sub:'Konten MUNIN', icon:'instagram', url:'https://www.instagram.com/munin.id' },  // GANTI USERNAME
    { group:'social', label:'TikTok',      sub:'Konten MUNIN', icon:'tiktok',    url:'https://www.tiktok.com/@munin.id' },    // GANTI USERNAME
    { group:'market', label:'Shopee',      icon:'bag', url:'' },   // isi url saat toko sudah buka
    { group:'market', label:'TikTok Shop', icon:'bag', url:'' }    // isi url saat toko sudah buka
    // contoh tambah: { group:'social', label:'YouTube', sub:'Konten MUNIN', icon:'link', url:'https://youtube.com/@...' },
  ]
};

/* ===================== UI (jangan perlu diubah) ===================== */
(() => {
const TAU = Math.PI * 2, $ = s => document.querySelector(s);
const PATHS = {
  instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/>',
  tiktok:'<path d="M14 3.5v10.2a3.7 3.7 0 1 1-3.7-3.7"/><path d="M14 3.5c.3 2.4 2 4.1 4.6 4.3"/>',
  whatsapp:'<path d="M3.5 20.5l1.4-4.3A8.4 8.4 0 1 1 8 19.3l-4.5 1.2z"/><path d="M9.2 8.6c-.3 3.200 3 6.400 6.300 6.300l.9-1.500-2-1-.8.8c-.9-.4-1.800-1.300-2.200-2.200l.8-.8-1-2z"/>',
  bag:'<path d="M5 8.5h14l-1 11.5H6L5 8.5z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>'
};
const ic = (n, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none">${PATHS[n] || PATHS.link}</svg>`;

document.title = `${CONFIG.brand} • ${CONFIG.status}`;
$('#status').textContent = CONFIG.status; $('#bn').textContent = CONFIG.brand;
$('#tag').textContent = CONFIG.tagline;
$('#hint').textContent = CONFIG.hint;
$('#title').setAttribute('aria-label', CONFIG.brand);
$('#title').innerHTML = [...CONFIG.brand].map((c, i) => `<span aria-hidden="true" style="--i:${i}">${c}</span>`).join('');

const WA = CONFIG.whatsapp;
const waUrl = 'https://wa.me/' + String(WA.number).replace(/\D/g, '') + '?text=' + encodeURIComponent(WA.message);
const live = CONFIG.links.filter(l => l.enabled !== false);
const item = (l, cls) => l.url
  ? `<a class="${cls}" href="${l.url}" target="_blank" rel="noopener noreferrer">${ic(l.icon)}<span><b>${l.label}</b>${l.sub ? `<small>${l.sub}</small>` : ''}</span></a>`
  : `<span class="${cls} soon" aria-disabled="true">${ic(l.icon)}<span><b>${l.label}</b><small>Segera hadir</small></span></span>`;
const soc = live.filter(l => l.group === 'social'), mk = live.filter(l => l.group === 'market');
$('#actions').innerHTML =
  `<a class="cta" href="${waUrl}" target="_blank" rel="noopener noreferrer">${ic('whatsapp', 26)}<span><b>${WA.label}</b><small>${WA.sub}</small></span></a>` +
  (soc.length ? `<div class="grid">${soc.map(l => item(l, 'btn')).join('')}</div>` : '') +
  (mk.length ? `<p class="cap">Marketplace</p><div class="grid">${mk.map(l => item(l, 'chip')).join('')}</div>` : '') +
