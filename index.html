<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNIN - Under Construction</title>
    
    <!-- Google Fonts: Gentium Plus -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --white: #ffffff;
            --black: #000000;
            --navy-blue: #001159;
            --grey-blue: #878fad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Gentium Plus', Georgia, serif;
            color: var(--white);
        }

        /* Canvas 3D Viewport */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer Overlay */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.25rem;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--grey-blue);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            padding: 0.35rem 0.75rem;
            background: rgba(0, 17, 89, 0.4);
            border: 1px solid var(--grey-blue);
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--white);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--white);
            animation: blink 1.8s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        /* Hero Content */
        .hero-section {
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-title {
            font-size: clamp(3rem, 16vw, 6.5rem);
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--white);
            text-shadow: 0 0 20px rgba(0, 17, 89, 0.8);
            line-height: 1;
            margin-bottom: 0.75rem;
            user-select: none;
        }

        .hero-text {
            font-size: clamp(0.95rem, 4vw, 1.25rem);
            color: var(--grey-blue);
            max-width: 320px;
            line-height: 1.4;
            font-style: italic;
            margin-bottom: 1.5rem;
        }

        /* Links Grid (Mobile Optimized) */
        .links-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            width: 100%;
            max-width: 380px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1rem;
            background: rgba(0, 17, 89, 0.35);
            border: 1px solid rgba(135, 143, 173, 0.4);
            border-radius: 8px;
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .link-card:active, .link-card:hover {
            background: var(--navy-blue);
            border-color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 17, 89, 0.6);
        }

        .link-card svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.75rem;
            color: var(--grey-blue);
            letter-spacing: 0.05em;
        }

        .interaction-hint {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.8;
        }

        @media (min-width: 768px) {
            .ui-layer { padding: 3rem 4rem; }
            .hero-text { max-width: 480px; }
            .links-container { grid-template-columns: repeat(4, 1fr); max-width: 640px; }
        }
    </style>
</head>

    <script>
        // --- THREE.JS SCENE CONFIGURATION ---
        const container = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // Primary Brand Accent Light: #001159 (Navy)
        const navyLight = new THREE.PointLight(0x001159, 12, 20);
        navyLight.position.set(4, 4, 4);
        scene.add(navyLight);

        // Secondary Accent Light: #878fad (Grey Blue)
        const greyBlueLight = new THREE.PointLight(0x878fad, 4, 15);
        greyBlueLight.position.set(-4, -3, 2);
        scene.add(greyBlueLight);

        // --- 3D BRAND MONOLITH (MUNIN FLOATING CORE) ---
        const geometry = new THREE.OctahedronGeometry(1.8, 0);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x001159,
            metalness: 0.9,
            roughness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            flatShading: true
        });

        const mainMesh = new THREE.Mesh(geometry, material);
        scene.add(mainMesh);

        // Outer Structural Cage (#878fad)
        const outerGeo = new THREE.OctahedronGeometry(2.1, 1);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0x878fad,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        scene.add(outerMesh);

        // --- PARTICLES (WHITE & GREY BLUE) ---
        const particleCount = window.innerWidth < 768 ? 250 : 600;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 18;
            positions[i+1] = (Math.random() - 0.5) * 18;
            positions[i+2] = (Math.random() - 0.5) * 18;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.025,
            transparent: true,
            opacity: 0.4
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- MOBILE TOUCH & MOUSE INTERACTION ---
        let targetRotationX = 0;
        let targetRotationY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        const onPointerDown = (e) => {
            isDragging = true;
            previousMousePosition = {
                x: e.touches ? e.touches[0].clientX : e.clientX,
                y: e.touches ? e.touches[0].clientY : e.clientY
            };
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = currentX - previousMousePosition.x;
            const deltaY = currentY - previousMousePosition.y;

            targetRotationY += deltaX * 0.008;
            targetRotationX += deltaY * 0.008;

            previousMousePosition = { x: currentX, y: currentY };
        };

        const onPointerUp = () => { isDragging = false; };

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotasi inersia halus
            mainMesh.rotation.y += (targetRotationY - mainMesh.rotation.y) * 0.05 + 0.003;
            mainMesh.rotation.x += (targetRotationX - mainMesh.rotation.x) * 0.05 + 0.002;

            outerMesh.rotation.y = -mainMesh.rotation.y * 0.8;
            outerMesh.rotation.x = -mainMesh.rotation.x * 0.8;

            // Efek melayang (Floating effect)
            mainMesh.position.y = Math.sin(elapsedTime * 1.4) * 0.15;
            outerMesh.position.y = mainMesh.position.y;

            // Rotasi sistem partikel lambat
            particleSystem.rotation.y = elapsedTime * 0.015;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
