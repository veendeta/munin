<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="MUNIN, Order & diskusi via WhatsApp.">
<title>MUNIN's Lair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--white:#ffffff;--black:#000000;--navy:#001159;--neon:#0030ff;--grey:#878fad;
--serif:'Gentium Book Plus',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#000}body{min-height:100%;overflow-x:hidden;color:var(--white);font-family:var(--sans);font-weight:600;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.bgfx{position:fixed;inset:0;z-index:-1;opacity:var(--bgo,1);background:radial-gradient(120% 85% at 50% 38%,var(--navy) 0%,#000a33 42%,#000 80%)}
#track{height:420vh;height:420svh}
canvas.pix{image-rendering:pixelated}
.scr{margin-top:.9rem;font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--grey);animation:blink 2.2s ease-in-out infinite}
.cue{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;text-align:center;opacity:0;pointer-events:none;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:#cfd4e6}
.cue b{font-family:var(--serif);font-size:1.5rem;letter-spacing:.1em;margin-top:.5rem;text-shadow:0 0 18px rgba(0,48,255,.9);display:none}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(135,143,173,.35);background:rgba(0,17,89,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;width:min(290px,86vw);padding:16px;border:1px solid rgba(135,143,173,.35);border-radius:16px;background:rgba(0,6,30,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;pointer-events:auto;touch-action:manipulation}
.panel.open{display:block}
.panel h2{font-size:.6rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--grey);margin-bottom:12px}
.panel label{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.7rem;margin-bottom:12px}
.panel output{color:var(--grey)}
.panel input{grid-column:1/-1;width:100%;accent-color:#0030ff}
.panel button{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(135,143,173,.4);background:transparent;color:#fff;font:600 .65rem var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.hl{font-weight:600;letter-spacing:.14em;padding:0 .1em;background:linear-gradient(transparent 72%,rgba(0,48,255,.6) 72%)}
.cue em{display:block;font-style:normal;font-family:var(--serif);font-size:1.15rem;letter-spacing:.06em;margin-top:.55rem;text-transform:none;color:#fff;text-shadow:0 0 14px rgba(0,48,255,.8)}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:18px;font-family:var(--serif);font-weight:700;font-size:.95rem;letter-spacing:.32em;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 12px rgba(0,48,255,.7)}
.rbtn{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);pointer-events:auto;display:none;padding:12px 22px;border:1px solid rgba(135,143,173,.5);border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font:600 .68rem var(--sans);letter-spacing:.28em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.rbtn.show{display:block}
.grid,.cap,.foot{max-height:200px;transition:opacity .4s,max-height .5s,margin .5s}
body.mid .grid,body.mid .cap,body.mid .foot{opacity:0;max-height:0;margin:0;overflow:hidden;pointer-events:none}
body.mid .actions{gap:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 18px)}
.pill{display:inline-flex;align-items:center;gap:.65rem;padding:.55rem 1rem;border:1px solid rgba(135,143,173,.35);border-radius:99px;
font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:#cfd4e6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:up .9s .2s both}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--neon);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,48,255,.9)}70%,100%{box-shadow:0 0 0 9px rgba(0,48,255,0)}}
.hero{position:absolute;left:50%;top:var(--ty,58%);transform:translate(-50%,0);width:100%;text-align:center;padding:0 20px;will-change:transform}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,17vw,7.5rem);letter-spacing:.14em;padding-left:.14em;line-height:1;color:var(--white);
text-shadow:0 0 28px rgba(0,48,255,.9),0 0 80px rgba(0,48,255,.5);animation:glow 4s ease-in-out infinite alternate;perspective:600px}
@keyframes glow{to{text-shadow:0 0 16px rgba(0,48,255,.6),0 0 56px rgba(0,48,255,.3)}}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em) rotateX(-70deg);filter:blur(10px);
animation:in 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 250ms)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.tag{display:inline-block;position:relative;margin:0 auto;font-size:clamp(.8rem,4.4vw,1.3rem);letter-spacing:.14em;text-transform:uppercase;line-height:1.3;white-space:nowrap;
color:transparent;background:linear-gradient(100deg,#fff 0 38%,#8aa2ff 50%,#fff 62% 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 0 10px rgba(0,48,255,.95)) drop-shadow(0 0 28px rgba(0,48,255,.6));animation:up .9s .9s both,shine 3.6s linear 1.8s infinite}
.tag::before,.tag::after{content:'';position:absolute;top:50%;width:clamp(14px,6vw,56px);height:1px;background:linear-gradient(90deg,transparent,var(--neon))}
.tag::before{right:calc(100% + 10px)}
.tag::after{left:calc(100% + 10px);transform:scaleX(-1)}
@keyframes shine{to{background-position:-250% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{position:absolute;left:50%;top:var(--cy,31%);margin:0;font-size:var(--fs,2.2rem);padding-left:.14em;white-space:nowrap;pointer-events:none;will-change:transform;animation:none;
transform:translate(-50%,-50%);text-shadow:var(--gj,0px) 0 0 rgba(0,48,255,.95),calc(var(--gj,0px) * -1) 0 0 rgba(135,143,173,.9),0 0 2px #000,0 0 10px rgba(0,8,40,.95),0 0 24px rgba(0,17,89,.9),0 0 40px rgba(0,48,255,.45)}
.hint{margin-top:1.4rem;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);animation:blink 2.6s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0;animation:none}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.actions{width:min(100%,420px);display:grid;gap:10px;animation:up .9s 1s both}
.actions a,.actions .soon{pointer-events:auto}
.cta,.btn,.chip{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white);border-radius:16px}
.cta{position:relative;overflow:hidden;justify-content:center;padding:16px 18px;background:linear-gradient(135deg,var(--neon),#0a1fc9);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 40px rgba(0,48,255,.5);transition:transform .2s}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:active,.btn:active{transform:scale(.98)}
b{display:block;font-weight:600}
.cta b{font-size:.85rem;letter-spacing:.03em}
small{display:block;font-size:.6rem;letter-spacing:.04em;margin-top:2px;opacity:.75;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
.btn,.chip{padding:13px 14px;background:rgba(0,10,50,.78);border:1px solid rgba(135,143,173,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s}
.btn b{font-size:.74rem}
.btn small,.chip small{color:var(--grey);opacity:1}
.chip{padding:10px 12px;border-radius:14px}
.chip b{font-size:.66rem}
.chip svg{width:18px;height:18px}
a.btn:hover,a.chip:hover{border-color:var(--neon);box-shadow:0 0 24px rgba(0,48,255,.45);transform:translateY(-2px)}
.soon{border-style:dashed;opacity:.7;cursor:default}
.cap,.foot{text-align:center;font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);margin-top:4px}
.foot{letter-spacing:.2em;opacity:.6}
a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
@media (max-height:700px){.actions{gap:8px}.cta{padding:12px 16px}.foot,.cap{display:none}}
@media (min-width:900px){.actions{width:460px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bgfx"></div><div id="track"></div>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <h1 id="title" class="mark"></h1>
  <div class="pill"><i></i><span id="status"></span></div>
  <div class="hero" id="hero">
    
    <p class="tag" id="tag"></p>
    <p class="hint" id="hint"></p>
    <p class="scr">Scroll &darr;</p>
  </div>
  <div class="brand" id="brand"></div>
  <div class="cue" id="cue"><span id="cueT"></span><em id="cueS"></em></div>
  <button class="rbtn" id="bhr">Semua tertelan · Reset</button>
  <button class="gear" id="gear" aria-label="Pengaturan efek visual"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>

    <button id="rst">Reset Background</button></div>
  <div class="actions" id="actions"></div>
</div>

$('#status').textContent = CONFIG.status; $('#brand').textContent = CONFIG.brand;
$('#tag').textContent = CONFIG.tagline;

$('#title').setAttribute('aria-label', CONFIG.brand);
$('#title').innerHTML = [...CONFIG.brand].map((c, i) => `<span aria-hidden="true" style="--i:${i}">${c}</span>`).join('');

const item = (l, cls) => l.url

  : `<span class="${cls} soon" aria-disabled="true">${ic(l.icon)}<span><b>${l.label}</b><small>Segera hadir</small></span></span>`;
const soc = live.filter(l => l.group === 'social'), mk = live.filter(l => l.group === 'market');
$('#actions').innerHTML =
  `<a class="cta" href="${waUrl}" target="_blank" rel="noopener noreferrer">${ic('whatsapp', 26)}<span><b>${WA.label}</b><small>${WA.sub}</small></span></a>` +
  (soc.length ? `<div class="grid">${soc.map(l => item(l, 'btn')).join('')}</div>` : '') +
  (mk.length ? `<p class="cap">Marketplace</p><div class="grid">${mk.map(l => item(l, 'chip')).join('')}</div>` : '') +
  `<p class="foot">© ${new Date().getFullYear()} <span class="hl">${CONFIG.brand}</span></p>`;

          const a = (1 - k / c.len) * (.25 + .6 * mi) * dk; ctx.fillStyle = k ? `rgba(0,255,34,${a})` : `rgba(190,255,200,${Math.min(1, a + .25)})`;
          ctx.fillText(MCH[(c.sd + k * 7 + ((t * (k ? 3 : 14)) | 0)) % MCH.length], wxx, wyy);
        }
      }
      if (toks.length < 4 && Math.random() < .01 + mi * .03) toks.push({ s: Math.random() < .5 ? '1014' : 'M V IV I IV', x: rnd(.15, .7) * W, y: rnd(.1, .9) * H, t0: t, life: rnd(.5, 1.1), z: rnd(18, 34) });
      for (let i = toks.length; i--;) {
        const o = toks[i], u2 = (t - o.t0) / o.life; if (u2 >= 1) { toks.splice(i, 1); continue; }
        const a = (Math.sin(t * 60 + i) > -.3 ? 1 : .25) * (1 - u2) * (.5 + mi), jx = (Math.random() - .5) * 8 * mi;
        ctx.font = `700 ${o.z}px monospace`; ctx.textAlign = 'left';
        ctx.fillStyle = `rgba(0,120,16,${a})`; ctx.fillText(o.s, o.x + jx + 3, o.y + 2); ctx.fillStyle = `rgba(0,255,34,${a})`; ctx.fillText(o.s, o.x + jx, o.y);
      }
    }

    warp = Math.max(warp * Math.pow(.95, dt), Math.min(1, sv / 30));
    const ss = (reduce ? 0 : .0012 + warp * .025) * dt; ctx.fillStyle = '#c8d2ff';
    for (const s of S) {
      s.z -= ss; if (s.z <= .02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
      let sx = gx + s.x / s.z * W * .28 + (spx - .5) * -40 * (1 - s.z), sy = gy + s.y / s.z * H * .28 + (spy - .5) * -40 * (1 - s.z);
      if (sx < 0 || sx > W || sy < 0 || sy > H) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = .6 + Math.random() * .4; continue; }
      if (!pull(sx, sy)) continue;
      ctx.globalAlpha = Math.min(1, (1 - s.z) * 1.2) * dk; const z = .4 + (1 - s.z) * 2; ctx.fillRect(wxx, wyy, z, z);
    }

    const act = mouseIn || down, ZR = R * .9;    // zona interaksi sigil
    if (act) { zone.x = px * W; zone.y = py * H; }
    zone.p += ((act || t < zone.hold ? 1 : 0) - zone.p) * .1 * dt;
    if (zone.p > .02) { ctx.globalAlpha = .1 * zone.p; ctx.drawImage(SPB, zone.x - ZR, zone.y - ZR, ZR * 2, ZR * 2); }
    if (GL) for (const k of FL) {
      const dx = k.x - zone.x, dy = k.y - zone.y, d = Math.hypot(dx, dy) || 1, f = Math.pow(Math.max(0, 1 - d / ZR), 1.2) * zone.p;
      if (f > 0) { k.ex += (dx / d * .05 - dy / d * .07) * f * dt; k.ey += (dy / d * .05 + dx / d * .07) * f * dt; }
      k.ex *= Math.pow(.96, dt); k.ey *= Math.pow(.96, dt); k.zap *= Math.pow(.93, dt);
      k.x += (mv * (k.dx + Math.sin(t * .8 + k.ph) * .12 * k.dp) + k.ex) * dt; k.y += (mv * k.dy + k.ey) * dt; k.rot += (mv * k.vr + f * .06) * dt;
      if (k.x < -40) k.x = W + 40; else if (k.x > W + 40) k.x = -40; if (k.y < -40) k.y = H + 40; else if (k.y > H + 40) k.y = -40;
      if (!pull(k.x, k.y)) continue;
      let al = .2 * k.dp * (.7 + .3 * Math.sin(t * 1.3 + k.ph)) + f * .6 + k.zap * .5; if (f > .12 || k.zap > .2) al *= Math.sin(t * 70 + k.ph * 9) > -.3 ? 1 : .3;
      const s2 = R * k.f / SIGA.width; ctx.save(); ctx.translate(wxx, wyy); ctx.rotate(k.rot); ctx.scale(k.flip * s2, s2);
      ctx.globalAlpha = Math.min(.9, al) * dk; ctx.drawImage(GL, -GL.width / 2, -GL.height / 2); ctx.restore();
    }

    if (mi > 0 && Math.random() < mi * .5) {     // glitch: potongan baris latar bergeser
      const cw = cv.width, ch = cv.height, q = Math.min(1, mi * 1.6), n = 1 + (Math.random() * mi * 10 | 0);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      for (let i = 0; i < n; i++) { const y = Math.random() * ch | 0, h = (2 + Math.random() * ch * .05 * q) | 0; ctx.drawImage(cv, 0, y, cw, h, (Math.random() - .5) * cw * .3 * q, y, cw, h); }
      ctx.restore();
    }
    if (FX.bh > 0) drawHole(dt);
  }

  /* ===== DEPAN: edge link graph / partikel ===== */
  ctx.globalCompositeOperation = 'lighter';
  const lim = (R * .9) ** 2;
  for (const [g, w] of [[GR.b, wB], [GR.c, wC]]) {
    if (!g || w < .02) continue;
    ctx.beginPath();
    for (const [i, j] of g.E) { const a = P[i], b = P[j], dx = a.sx - b.sx, dy = a.sy - b.sy; if (dx * dx + dy * dy < lim) { ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); } }
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgb(130,160,255)'; ctx.globalAlpha = w * .6; ctx.stroke();
    if (pulses.length) {
      ctx.beginPath();
      for (const [i, j] of g.E) { if (PB[i] + PB[j] > .6) { ctx.moveTo(P[i].sx, P[i].sy); ctx.lineTo(P[j].sx, P[j].sy); } }
      ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgb(255,255,255)'; ctx.globalAlpha = w * .9; ctx.stroke();
    }
  }
  const sc = Math.max(.7, R / 170), nb = 24 * wA + 11 * (1 - wA), ba = .6 * wA + .85 * (1 - wA);
  for (let i = 0; i < P.length; i++) {
    const p = P[i], b = PB[i];
    ctx.globalAlpha = Math.max(.12, Math.min(1, ba - p.sz / (R * 2.6) + flash * .3 + b * .5));
    const s = (nb + b * 16) * p.s * p.k * sc; ctx.drawImage(SP[b > .3 ? 2 : p.col], p.sx - s / 2, p.sy - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.save(); ctx.translate(gx, gy); ctx.scale(1, .4); ctx.globalAlpha = .55 * wA; ctx.drawImage(DK, -R, -R, R * 2, R * 2); ctx.restore();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
  for (let i = ripples.length; i--;) {
    const r = ripples[i]; r.r += 4 * dt; r.a -= .018 * dt;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(90,125,255,${r.a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
})();
