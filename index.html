<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="MUNIN, Order & diskusi via WhatsApp.">
<title>MUNIN's Lair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--white:#ffffff;--black:#000000;--navy:#001159;--neon:#0030ff;--grey:#878fad;
--serif:'Gentium Book Plus',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--white);font-family:var(--sans);font-weight:600;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(120% 85% at 50% 38%,var(--navy) 0%,#000a33 42%,#000 80%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 18px)}
.pill{display:inline-flex;align-items:center;gap:.65rem;padding:.55rem 1rem;border:1px solid rgba(135,143,173,.35);border-radius:99px;
font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:#cfd4e6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:up .9s .2s both}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--neon);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,48,255,.9)}70%,100%{box-shadow:0 0 0 9px rgba(0,48,255,0)}}
.hero{position:absolute;left:50%;top:var(--ty,58%);transform:translate(-50%,0);width:100%;text-align:center;padding:0 20px;will-change:transform}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,17vw,7.5rem);letter-spacing:.14em;padding-left:.14em;line-height:1;color:var(--white);
text-shadow:0 0 28px rgba(0,48,255,.9),0 0 80px rgba(0,48,255,.5);animation:glow 4s ease-in-out infinite alternate;perspective:600px}
@keyframes glow{to{text-shadow:0 0 16px rgba(0,48,255,.6),0 0 56px rgba(0,48,255,.3)}}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em) rotateX(-70deg);filter:blur(10px);
animation:in 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 250ms)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.tag{display:inline-block;position:relative;margin:0 auto;font-size:clamp(.8rem,4.4vw,1.3rem);letter-spacing:.14em;text-transform:uppercase;line-height:1.3;white-space:nowrap;
color:transparent;background:linear-gradient(100deg,#fff 0 38%,#8aa2ff 50%,#fff 62% 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 0 10px rgba(0,48,255,.95)) drop-shadow(0 0 28px rgba(0,48,255,.6));animation:up .9s .9s both,shine 3.6s linear 1.8s infinite}
.tag::before,.tag::after{content:'';position:absolute;top:50%;width:clamp(14px,6vw,56px);height:1px;background:linear-gradient(90deg,transparent,var(--neon))}
.tag::before{right:calc(100% + 10px)}
.tag::after{left:calc(100% + 10px);transform:scaleX(-1)}
@keyframes shine{to{background-position:-250% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{position:absolute;left:50%;top:var(--cy,31%);margin:0;font-size:var(--fs,2.2rem);padding-left:.14em;white-space:nowrap;pointer-events:none;will-change:transform;animation:none;
transform:translate(-50%,-50%);text-shadow:0 0 2px #000,0 0 10px rgba(0,8,40,.95),0 0 24px rgba(0,17,89,.9),0 0 40px rgba(0,48,255,.45)}
.hint{margin-top:1.4rem;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);animation:blink 2.6s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0;animation:none}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.actions{width:min(100%,420px);display:grid;gap:10px;animation:up .9s 1s both}
.actions a,.actions .soon{pointer-events:auto}
.cta,.btn,.chip{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white);border-radius:16px}
.cta{position:relative;overflow:hidden;justify-content:center;padding:16px 18px;background:linear-gradient(135deg,var(--neon),#0a1fc9);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 40px rgba(0,48,255,.5);transition:transform .2s}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:active,.btn:active{transform:scale(.98)}
b{display:block;font-weight:600}
.cta b{font-size:.85rem;letter-spacing:.03em}
small{display:block;font-size:.6rem;letter-spacing:.04em;margin-top:2px;opacity:.75;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
.btn,.chip{padding:13px 14px;background:rgba(0,17,89,.35);border:1px solid rgba(135,143,173,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s}
.btn b{font-size:.74rem}
.btn small,.chip small{color:var(--grey);opacity:1}
.chip{padding:10px 12px;border-radius:14px}
.chip b{font-size:.66rem}
.chip svg{width:18px;height:18px}
a.btn:hover,a.chip:hover{border-color:var(--neon);box-shadow:0 0 24px rgba(0,48,255,.45);transform:translateY(-2px)}
.soon{border-style:dashed;opacity:.7;cursor:default}
.cap,.foot{text-align:center;font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);margin-top:4px}
.foot{letter-spacing:.2em;opacity:.6}
a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
@media (max-height:700px){.actions{gap:8px}.cta{padding:12px 16px}.foot,.cap{display:none}}
@media (min-width:900px){.actions{width:460px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <h1 id="title" class="mark"></h1>
  <div class="pill"><i></i><span id="status"></span></div>
  <div class="hero" id="hero">
    
    <p class="tag" id="tag"></p>
    <p class="hint" id="hint"></p>
  </div>
  <div class="actions" id="actions"></div>
</div>

<script>
/* =====================================================================
   KONFIGURASI — edit bagian ini saja untuk mengubah teks & tombol

   TAMBAH tombol : salin satu baris di `links`, ubah isinya.
   HAPUS tombol  : hapus barisnya, atau tambahkan  enabled:false
   group         : 'social' (tombol besar) | 'market' (chip kecil marketplace)
   url kosong '' : tombol tampil abu-abu "Segera hadir" (belum bisa diklik).

   icon          : instagram | tiktok | whatsapp | bag | link

  : `<span class="${cls} soon" aria-disabled="true">${ic(l.icon)}<span><b>${l.label}</b><small>Segera hadir</small></span></span>`;

  (mk.length ? `<p class="cap">Marketplace</p><div class="grid">${mk.map(l => item(l, 'chip')).join('')}</div>` : '') +
  `<p class="foot">© ${new Date().getFullYear()} ${CONFIG.brand}</p>`;

const P = []; let E = [], SPR = null, GL = null;
const rnd = (a, b) => a + Math.random() * (b - a);
const mk3 = o => Object.assign({ ox:0, oy:0, oz:0, vx:0, vy:0, vz:0, sx:0, sy:0, sz:0, k:1, ring:0, bx:0, by:0, bz:0, tx:0, ty:0, tz:0, c:3, s:1 }, o);

function load(b64, cb) { const im = new Image(); im.onload = () => cb(im); im.src = 'data:image/png;base64,' + b64; }

/* LOGO -> partikel: titik diambil acak dari mask logo; saat load menyusun diri, saat diketuk pecah lalu menyusun ulang */
load(LOGO_B64, im => {
  const w = im.width, h = im.height, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, w, h).data, on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4] > 128;
  const fill = [], edge = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (on(x, y)) (on(x - 1, y) && on(x + 1, y) && on(x, y - 1) && on(x, y + 1) ? fill : edge).push([x, y]);
  const half = Math.max(w, h) / 2;
  const add = (arr, n, isEdge) => {
    for (let i = 0; i < n; i++) {
      const q = arr[Math.random() * arr.length | 0], r = Math.random();
      const x = (q[0] + Math.random() - w / 2) / half, y = (q[1] + Math.random() - h / 2) / half;
      const z = isEdge ? (Math.random() < .5 ? -.12 : .12) : rnd(-.12, .12);
      P.push(mk3({ bx:x, by:y, bz:z, tx:x, ty:y, tz:z, ox:rnd(-3, 3), oy:rnd(-3, 3), oz:rnd(-1.5, 1.5),
        c: isEdge ? (r < .35 ? 2 : r < .7 ? 3 : 0) : (r < .1 ? 2 : r < .4 ? 1 : r < .7 ? 0 : 3),
        s: isEdge ? .7 + Math.random() * .8 : .5 + Math.random() * .6 }));
    }
  };
  add(edge, 380, true); add(fill, 480, false);
});

/* SIGIL -> sprite petir (gambar lengan sigil asli, diberi warna biru + glow) */
load(SIG_B64, im => {
  const w = im.width, h = im.height, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { a[i + 3] = a[i]; a[i] = 150; a[i + 1] = 172; a[i + 2] = 255; }
  g.putImageData(d, 0, 0); SPR = c;
  const pad = 40; GL = document.createElement('canvas'); GL.width = w + pad * 2; GL.height = h + pad * 2;
  const q = GL.getContext('2d'); q.shadowColor = '#0030ff'; q.shadowBlur = 26;
  q.drawImage(c, pad, pad); q.drawImage(c, pad, pad);
});

/* SIGIL berterbangan: kecil, redup, melayang pelan. Di dekat jari/kursor (satu area) mereka menyala, berkedip & berputar */
const FL = [], zone = { x: -999, y: -999, p: 0, hold: 0 };
function initFloaters() {
  const n = W < 700 ? 16 : 26;
  for (let i = 0; i < n; i++) {
    const dp = rnd(.45, 1);
    FL.push({ x: rnd(0, W), y: rnd(0, H), dx: rnd(-.2, .2) * dp, dy: rnd(-.35, -.05) * dp, ex: 0, ey: 0, dp,
      f: rnd(.2, .42) * dp, rot: rnd(0, TAU), vr: rnd(-.006, .006), flip: Math.random() < .5 ? 1 : -1, ph: rnd(0, TAU), zap: 0 });
  }
}
initFloaters();
function zapAt(x, y) {   // ketukan: sigil di sekitar titik ketuk terpental & menyala
  for (const k of FL) {
    const dx = k.x - x, dy = k.y - y, d = Math.hypot(dx, dy) || 1, f = Math.max(0, 1 - d / (R * 1.4));
    k.ex += dx / d * f * rnd(2, 5); k.ey += dy / d * f * rnd(2, 5); k.zap = Math.max(k.zap, f);
  }
}
const S = Array.from({ length: 140 }, () => ({ x:Math.random() * 2 - 1, y:Math.random() * 2 - 1, z:Math.random() }));

let rx = -.25, ry = 0, vrx = 0, vry = 0, drag = false, down = null;
let px = .5, py = .5, spx = .5, spy = .5, mx = -999, my = -999, mouseIn = false;
let last = 0, t = 0, warp = 0; const ripples = [];
const clampV = v => Math.max(-.15, Math.min(.15, v));

function burst(x, y) {
  ripples.push({ x, y, r:8, a:.9 }); warp = Math.min(1, warp + .8); flash = 1; zone.x = x; zone.y = y; zone.hold = t + .7; zapAt(x, y);
  $('#tag').animate([{ transform:'scale(1.04)' }, { transform:'scale(1)' }], { duration:380, easing:'ease-out' });
  for (const p of P) {
    const dx = p.sx - x, dy = p.sy - y, f = Math.exp(-(dx * dx + dy * dy) / (R * R)), l = Math.hypot(p.bx, p.by, p.bz) || 1;
    const m = (.1 + Math.random() * .25) * (.3 + f * 1.4);
    p.vx += p.bx / l * m + (Math.random() - .5) * .05;
    p.vy += p.by / l * m + (Math.random() - .5) * .05;
    p.vz += p.bz / l * m + (Math.random() - .5) * .05;
  }
}

  down = { t:performance.now(), lx:e.clientX, ly:e.clientY, moved:0 };
  drag = true; vrx = vry = 0; px = e.clientX / W; py = e.clientY / H; $('#hint').classList.add('gone');
});
addEventListener('pointermove', e => {
  px = e.clientX / W; py = e.clientY / H; mx = e.clientX; my = e.clientY; mouseIn = e.pointerType === 'mouse';

  const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
  down.lx = e.clientX; down.ly = e.clientY; down.moved += Math.abs(dx) + Math.abs(dy);
  ry += dx * .008; rx = Math.max(-1.3, Math.min(1.3, rx + dy * .008));
  vry = clampV(dx * .008); vrx = clampV(dy * .008);
});
addEventListener('pointerup', e => {
  if (!down) return; drag = false;
  if (down.moved < 8 && performance.now() - down.t < 400) burst(e.clientX, e.clientY);
  down = null;
});
addEventListener('pointercancel', () => { drag = false; down = null; });
document.documentElement.addEventListener('mouseleave', () => { mouseIn = false; mx = my = -999; });

const hero = $('#hero'), mark = $('#title');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 16.667 || 1, 3); last = now; t += dt / 60;
  flash *= Math.pow(.9, dt);
  
  spx += (px - spx) * .06 * dt; spy += (py - spy) * .06 * dt;
  gx = cx + (spx - .5) * -18; gy = cy + (spy - .5) * -18;
  hero.style.transform = `translate(-50%,0) perspective(900px) rotateX(${-(spy - .5) * 8}deg) rotateY(${(spx - .5) * 10}deg)`;
  mark.style.transform = `translate(calc(-50% + ${gx - cx}px),calc(-50% + ${gy - cy}px)) perspective(${F}px) rotateX(${-rx}rad) rotateY(${ry}rad)`;

  if (drag) { vry *= Math.pow(.85, dt); vrx *= Math.pow(.85, dt); }
  else {
    vry *= Math.pow(.94, dt); vrx *= Math.pow(.94, dt);
    ry += vry * dt; ry = ((ry + Math.PI) % TAU + TAU) % TAU - Math.PI; ry += ((reduce ? 0 : Math.sin(t * .45) * .45) - ry) * .012 * dt; rx += vrx * dt + (-.08 - rx) * .006 * dt; rx = Math.max(-1.3, Math.min(1.3, rx));
  }

  const cr = Math.cos(ry), sr = Math.sin(ry), cq = Math.cos(rx), sq = Math.sin(rx);
  const K = .03 * dt, D = Math.pow(.955, dt), RR = 1.45, tc = Math.cos(.45), ts = Math.sin(.45), hov = mouseIn && !drag;
  for (const p of P) {
    p.bx += (p.tx - p.bx) * .05 * dt; p.by += (p.ty - p.by) * .05 * dt; p.bz += (p.tz - p.bz) * .05 * dt;
    p.vx -= p.ox * K; p.vy -= p.oy * K; p.vz -= p.oz * K;
    p.vx *= D; p.vy *= D; p.vz *= D;
    p.ox += p.vx * dt; p.oy += p.vy * dt; p.oz += p.vz * dt;
    const X0 = (p.bx + p.ox) * R, Y0 = (p.by + p.oy) * R, Z0 = (p.bz + p.oz) * R;
    const X = X0 * cr - Z0 * sr, Zr = X0 * sr + Z0 * cr, Y = Y0 * cq - Zr * sq, Z = Y0 * sq + Zr * cq, k = F / (F + Z);
    p.sx = gx + X * k; p.sy = gy + Y * k; p.sz = Z; p.k = k;
    if (hov) {
      const dx = p.sx - mx, dy = p.sy - my, d = Math.hypot(dx, dy), h = R * .4;
      if (d < h) {
        const f = (1 - d / h) * .02 * dt, l = Math.hypot(p.bx, p.by, p.bz) || 1;
        p.vx += p.bx / l * f; p.vy += p.by / l * f; p.vz += p.bz / l * f;
      }
    }
  }

  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .22 + .06 * Math.sin(t * 1.5) + flash * .12;
  ctx.drawImage(SP[0], gx - R * 1.5, gy - R * 1.5, R * 3, R * 3);

  warp *= Math.pow(.95, dt);
  const sp = reduce ? 0 : (.0012 + warp * .025) * dt;
  ctx.fillStyle = '#c8d2ff';
  for (const s of S) {
    s.z -= sp;
    if (s.z <= .02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
    const sx = gx + s.x / s.z * W * .28 + (spx - .5) * -40 * (1 - s.z), sy = gy + s.y / s.z * H * .28 + (spy - .5) * -40 * (1 - s.z);
    if (sx < 0 || sx > W || sy < 0 || sy > H) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = .6 + Math.random() * .4; continue; }
    ctx.globalAlpha = Math.min(1, (1 - s.z) * 1.2); const z = .4 + (1 - s.z) * 2; ctx.fillRect(sx, sy, z, z);
  }

  const act = mouseIn || down, tz = (act || t < zone.hold) ? 1 : 0, ZR = R * .9, mv = reduce ? 0 : 1;
  if (act) { zone.x = px * W; zone.y = py * H; }
  zone.p += (tz - zone.p) * .1 * dt;
  if (zone.p > .02) { ctx.globalAlpha = .1 * zone.p; ctx.drawImage(SP[0], zone.x - ZR, zone.y - ZR, ZR * 2, ZR * 2); }   // cahaya lembut penanda area
  if (GL) for (const k of FL) {
    const dx = k.x - zone.x, dy = k.y - zone.y, d = Math.hypot(dx, dy) || 1, f = Math.pow(Math.max(0, 1 - d / ZR), 1.2) * zone.p;
    if (f > 0) { k.ex += (dx / d * .05 - dy / d * .07) * f * dt; k.ey += (dy / d * .05 + dx / d * .07) * f * dt; }
    k.ex *= Math.pow(.96, dt); k.ey *= Math.pow(.96, dt); k.zap *= Math.pow(.93, dt);
    k.x += (mv * (k.dx + Math.sin(t * .8 + k.ph) * .12 * k.dp) + k.ex) * dt; k.y += (mv * k.dy + k.ey) * dt; k.rot += (mv * k.vr + f * .06) * dt;
    if (k.x < -40) k.x = W + 40; else if (k.x > W + 40) k.x = -40;
    if (k.y < -40) k.y = H + 40; else if (k.y > H + 40) k.y = -40;
    let al = .2 * k.dp * (.7 + .3 * Math.sin(t * 1.3 + k.ph)) + f * .6 + k.zap * .5;
    if (f > .12 || k.zap > .2) al *= Math.sin(t * 70 + k.ph * 9) > -.3 ? 1 : .3;
    const sc2 = R * k.f / SPR.width;
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.rot); ctx.scale(k.flip * sc2, sc2);
    ctx.globalAlpha = Math.min(.9, al); ctx.drawImage(GL, -GL.width / 2, -GL.height / 2); ctx.restore();
  }
  ctx.lineWidth = 1; ctx.globalAlpha = 1;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (const [i, j] of E) { const a = P[i], b = P[j]; if (((a.sz + b.sz) < 0) === (pass === 1)) { ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); } }
    ctx.strokeStyle = pass ? 'rgba(70,110,255,.42)' : 'rgba(135,143,173,.14)'; ctx.stroke();
  }

  const sc = Math.max(.7, R / 170);
  for (const p of P) {
    ctx.globalAlpha = Math.max(.12, Math.min(1, .6 - p.sz / (R * 2.6) + flash * .3));
    const s = (p.ring ? 13 : 24) * p.s * p.k * sc;
    ctx.drawImage(SP[p.c], p.sx - s / 2, p.sy - s / 2, s, s);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over'; ctx.save(); ctx.translate(gx, gy); ctx.scale(1, .4); ctx.globalAlpha = .55; ctx.drawImage(DK, -R, -R, R * 2, R * 2); ctx.restore(); ctx.globalCompositeOperation = 'lighter';
  for (let i = ripples.length; i--;) {
    const r = ripples[i]; r.r += 4 * dt; r.a -= .018 * dt;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(90,125,255,${r.a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
requestAnimationFrame(frame);
})();
</script>
