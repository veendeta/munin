<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNIN - Under Construction</title>
    
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            /* Primary Colors */
            --white: #ffffff;
            --black: #000000;
            --navy-blue: #001159;
            
            /* Secondary Colors */
            --neon-blue: #0030ff;
            --grey-blue: #878fad;

            /* Fonts */
            --font-primary: 'Gentium Book Plus', serif;
            --font-secondary: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--black);
            font-family: var(--font-secondary);
            color: var(--white);
        }

        /* 3D WebGL Background Canvas */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay Structure */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.25rem;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-subtitle {
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--grey-blue);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            padding: 0.4rem 0.85rem;
            background: rgba(0, 17, 89, 0.45);
            border: 1px solid var(--grey-blue);
            border-radius: 100px;
            backdrop-filter: blur(12px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse-glow 1.8s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--neon-blue); }
            50% { opacity: 0.3; transform: scale(0.85); box-shadow: 0 0 2px var(--neon-blue); }
        }

        /* Hero Main Content */
        .hero-section {
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .brand-title {
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: clamp(3.2rem, 16vw, 6.8rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
            text-shadow: 0 0 30px rgba(0, 48, 255, 0.4);
            line-height: 1;
            margin-bottom: 0.75rem;
            user-select: none;
        }

        .hero-text {
            font-family: var(--font-primary);
            font-style: italic;
            font-size: clamp(0.95rem, 3.8vw, 1.25rem);
            color: var(--grey-blue);
            max-width: 340px;
            line-height: 1.4;
            margin-bottom: 2rem;
        }

        /* Modular Action Button Stack (Mobile First) */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
            max-width: 380px;
        }

        .action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .action-card-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .action-card svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .action-card-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .action-title {
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .action-subtitle {
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: 0.68rem;
            opacity: 0.75;
            margin-top: 0.15rem;
        }

        .action-arrow {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        /* Style: Primary WhatsApp CTA */
        .action-card.primary-cta {
            background: linear-gradient(135deg, var(--navy-blue) 0%, var(--neon-blue) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(0, 48, 255, 0.35);
        }

        .action-card.primary-cta:active, .action-card.primary-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 48, 255, 0.6);
        }

        .action-card.primary-cta .action-arrow {
            transform: translateX(0);
        }

        .action-card.primary-cta:hover .action-arrow {
            transform: translateX(4px);
        }

        /* Style: Secondary Content Links (Instagram, TikTok, Marketplace) */
        .action-card.secondary-link {
            background: rgba(0, 17, 89, 0.35);
            border: 1px solid rgba(135, 143, 173, 0.3);
            color: var(--white);
        }

        .action-card.secondary-link:active, .action-card.secondary-link:hover {
            background: rgba(0, 17, 89, 0.7);
            border-color: var(--neon-blue);
            transform: translateY(-2px);
        }

        /* Style: Disabled / Coming Soon (Marketplace) */
        .action-card.disabled-link {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(135, 143, 173, 0.15);
            color: var(--grey-blue);
            cursor: not-allowed;
            opacity: 0.65;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--grey-blue);
            letter-spacing: 0.05em;
        }

        .touch-hint {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.8;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .ui-layer { padding: 3rem 4rem; }
            .hero-text { max-width: 460px; }
            .links-stack { max-width: 440px; }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-subtitle">MUNIN / OFFICIAL</div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>UNDER CONSTRUCTION</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="brand-title">MUNIN</h1>
            <p class="hero-text">Eksplorasi estetika dan konstruksi visual. Koleksi dan kanal resmi disiapkan berkala.</p>
            
            <!-- Dynamic Link Container -->
            <div id="links-container" class="links-stack interactive">
                <!-- Buttons dynamically populated from JS Data Array -->
            </div>
        </main>

        <footer class="interactive">
            <div>© 2026 MUNIN</div>
            <div class="touch-hint">
                <span>TOUCH & DRAG FOR 3D INTERACTIVE</span>
            </div>
        </footer>
    </div>

    <script>
        /* 
        ==========================================================================
        MODULAR BUTTON CONFIGURATION (EASY TO ADD / REMOVE / TOGGLE)
        --------------------------------------------------------------------------
        - Untuk menambah tombol baru: Tambah objek baru di dalam array `BUTTON_CONFIG`.
        - Untuk menyembunyikan tombol: Ubah `active: true` menjadi `active: false`.
        ==========================================================================
        */
        const BUTTON_CONFIG = [
            {
                id: 'whatsapp-order',
                type: 'primary', // Highlighted CTA untuk order langsung via WA tanpa admin fee
                title: 'Order & Diskusi via WhatsApp',
                subtitle: 'Pemesanan langsung di WA',
                url: 'https://wa.me/6285280004806?text=Halo%20MUNIN,%20saya%20ingin%20diskusi%20koleksi%20dan%20order.',
                active: true,
                iconSvg: `<svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>`
            },
            {
                id: 'instagram-content',
                type: 'secondary',
                title: 'Instagram MUNIN',
                subtitle: 'Eksplorasi konten visual & katalog visual',
                url: 'https://instagram.com/munin.id',
                active: true,
                iconSvg: `<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`
            },
            {
                id: 'tiktok-content',
                type: 'secondary',
                title: 'TikTok MUNIN',
                subtitle: 'Video sinematik & proses kreasi produk',
                url: 'https://tiktok.com/@munin.id',
                active: true,
                iconSvg: `<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.67 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.56-1.31 1.53-1.32 2.51-.01 1.01.47 1.98 1.28 2.57.87.62 2.03.74 3.02.33.88-.35 1.55-1.13 1.78-2.05.15-.65.12-1.32.12-1.99V.02z"/></svg>`
            },
            {
                id: 'marketplace-link',
                type: 'disabled', // Marketplace disiapkan untuk nanti (saat ini transaksi difokuskan via WA)
                title: 'Marketplace Store',
                subtitle: 'Segera Hadir (Gunakan WA untuk transaksi langsung)',
                url: '#',
                active: true,
                iconSvg: `<svg viewBox="0 0 24 24"><path d="M19.9 7.2c-.1-.2-.3-.3-.5-.3h-3.2C15.7 3.9 13.9 1.5 12 1.5S8.3 3.9 7.8 6.9H4.6c-.2 0-.4.1-.5.3s-.1.4 0 .6l2.1 13.3c.1.7.7 1.2 1.4 1.2h8.8c.7 0 1.3-.5 1.4-1.2l2.1-13.3c.1-.2 0-.4-.1-.6zm-7.9-4.2c1.2 0 2.4 1.8 2.8 3.9H9.2c.4-2.1 1.6-3.9 2.8-3.9zm5.3 17.8c0 .1-.1.2-.2.2H6.9c-.1 0-.2-.1-.2-.2L4.8 8.4h14.4l-1.9 12.4z"/></svg>`
            }
        ];

        // Render Button Stack
        function renderButtons() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            BUTTON_CONFIG.filter(item => item.active).forEach(item => {
                const card = document.createElement('a');
                
                if (item.type === 'primary') {
                    card.className = 'action-card primary-cta';
                    card.href = item.url;
                    card.target = '_blank';
                    card.rel = 'noopener';
                } else if (item.type === 'disabled') {
                    card.className = 'action-card disabled-link';
                    card.href = 'javascript:void(0)';
                } else {
                    card.className = 'action-card secondary-link';
                    card.href = item.url;
                    card.target = '_blank';
                    card.rel = 'noopener';
                }

                card.innerHTML = `
                    <div class="action-card-content">
                        ${item.iconSvg}
                        <div class="action-card-text">
                            <span class="action-title">${item.title}</span>
                            <span class="action-subtitle">${item.subtitle}</span>
                        </div>
                    </div>
                    <span class="action-arrow">→</span>
                `;
                
                container.appendChild(card);
            });
        }

        renderButtons();

        // --- THREE.JS IMMERSIVE 3D SCENE ---
        const container3D = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6.8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container3D.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        // Neon Blue Accent Light (#0030ff)
        const neonLight = new THREE.PointLight(0x0030ff, 14, 25);
        neonLight.position.set(4, 4, 4);
        scene.add(neonLight);

        // Deep Navy Base Light (#001159)
        const navyLight = new THREE.PointLight(0x001159, 8, 20);
        navyLight.position.set(-4, -4, 2);
        scene.add(navyLight);

        // White Highlight Light
        const whiteHighlight = new THREE.PointLight(0xffffff, 2, 10);
        whiteHighlight.position.set(0, 5, -2);
        scene.add(whiteHighlight);

        // 3D Monolith Structure (MUNIN Core Symbol)
        const geometry = new THREE.IcosahedronGeometry(1.9, 0);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x001159,
            metalness: 0.85,
            roughness: 0.15,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            flatShading: true
        });

        const mainMesh = new THREE.Mesh(geometry, material);
        scene.add(mainMesh);

        // Outer Structural Cage (#878fad + #0030ff blend)
        const outerGeo = new THREE.IcosahedronGeometry(2.25, 1);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0x878fad,
            wireframe: true,
            transparent: true,
            opacity: 0.22
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        scene.add(outerMesh);

        // Particle Field
        const particleCount = window.innerWidth < 768 ? 220 : 500;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 18;
            positions[i+1] = (Math.random() - 0.5) * 18;
            positions[i+2] = (Math.random() - 0.5) * 18;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x0030ff,
            size: 0.03,
            transparent: true,
            opacity: 0.5
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // Mobile Touch Drag & Mouse Interaction Logic
        let targetRotationX = 0;
        let targetRotationY = 0;
        let isDragging = false;
        let previousPosition = { x: 0, y: 0 };

        const onPointerDown = (e) => {
            isDragging = true;
            previousPosition = {
                x: e.touches ? e.touches[0].clientX : e.clientX,
                y: e.touches ? e.touches[0].clientY : e.clientY
            };
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = currentX - previousPosition.x;
            const deltaY = currentY - previousPosition.y;

            targetRotationY += deltaX * 0.008;
            targetRotationX += deltaY * 0.008;

            previousPosition = { x: currentX, y: currentY };
        };

        const onPointerUp = () => { isDragging = false; };

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // Animation Render Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Smooth rotation with inertia
            mainMesh.rotation.y += (targetRotationY - mainMesh.rotation.y) * 0.05 + 0.003;
            mainMesh.rotation.x += (targetRotationX - mainMesh.rotation.x) * 0.05 + 0.002;

            outerMesh.rotation.y = -mainMesh.rotation.y * 0.8;
            outerMesh.rotation.x = -mainMesh.rotation.x * 0.8;

            // Subtle floating levitation
            mainMesh.position.y = Math.sin(elapsedTime * 1.5) * 0.15;
            outerMesh.position.y = mainMesh.position.y;

            // Particle rotation
            particleSystem.rotation.y = elapsedTime * 0.015;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
